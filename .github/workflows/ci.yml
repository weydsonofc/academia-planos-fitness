
name: CI - Clinica Medica

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # JOB 1 - TESTES UNITARIOS
  unit-tests:
    name: Testes Unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes unitarios
        run: |
          python -m pytest tests/unit/ -v


  # JOB 2 - TESTES DE INTEGRACAO
  integration-tests:
    name: Testes de Integracao
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes de integracao
        run: |
          python -m pytest tests/integration/ -v

      - name: Gerar relatorio de cobertura
        run: |
          python -m pytest tests/unit/ tests/integration/ \
            --cov=app \
            --cov-report=term \
            --cov-report=html

      - name: Salvar relatorio HTML
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: htmlcov/
